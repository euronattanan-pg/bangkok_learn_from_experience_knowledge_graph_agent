services:
  app:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      NEO4J_URI: ${NEO4J_URI:-}
      NEO4J_USERNAME: ${NEO4J_USERNAME:-}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
      LFE_DATA_DIR: /data
      LFE_LISTEN_HOST: 0.0.0.0
    volumes:
      - lfe_data:/data
    restart: unless-stopped
volumes:
  lfe_data:
